[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "occ"
version = "0.2.0"
description = "Wi-Fi Signal Strength–Based Smart Room Occupancy Sensing System"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]
